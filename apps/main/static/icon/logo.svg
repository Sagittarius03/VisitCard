<defs>
    <!-- Градиенты для логотипа -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#00b894;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#55efc4;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="secondaryGradient" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#00b894;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
        <stop offset="0%" style="stop-color:#55efc4;stop-opacity:0.3" />
        <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:0" />
    </radialGradient>
    
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="70%">
        <stop offset="0%" style="stop-color:#1a2a2a;stop-opacity:1" />
        <stop offset="50%" style="stop-color:#0f1a1a;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#0a0f14;stop-opacity:1" />
    </radialGradient>

    <!-- Фильтр для свечения -->
    <filter id="glow">
        <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
        <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
    
    <filter id="shadow">
        <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00d4aa" flood-opacity="0.3"/>
    </filter>
</defs>
<defs>
        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
            <stop offset="40%" style="stop-color:#F97316;stop-opacity:1" />
            <stop offset="60%" style="stop-color:#EF4444;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#FBBF24;stop-opacity:1" />
        </linearGradient>
    </defs>

