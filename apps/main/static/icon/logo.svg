<circle cx="366" cy="408" r="380" fill="url(#bgGradient)" stroke="url(#mainGradient)" stroke-width="0"/>

<!-- Свечение за логотипом -->
<ellipse cx="366" cy="408" rx="300" ry="300" fill="url(#glowGradient)"/>

